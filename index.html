<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>页面已迁移</title>
  <!-- 0 秒后自动跳转到新地址 -->
  <meta http-equiv="refresh" content="0; url=https://clxx.eu.org">
</head>
<body>
  <p>本页面已迁移至 <a href="https://clxx.eu.org">https://clxx.eu.org</a></p>

    // JS 兜底跳转，部分浏览器 meta refresh 不触发时用
    window.location.replace("https://你要跳的域名");
  </script>
</body>
</html>
